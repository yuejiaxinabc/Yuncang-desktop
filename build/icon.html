<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:512px;height:512px;overflow:hidden}

.glyph{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:300px;font-weight:700;color:#fff;

</style></head>
<body><div class="wrap"><div class="glyph">云</div>
<div class="shelf"><i></i><i></i><i></i></div>
